name: iOS Build and IPA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NFCove
    runs-on: macos-26
    timeout-minutes: 30

    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
      IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Xcode version
        run: |
          xcodebuild -version
          swift --version
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR==1 {split($2,v,"."); print v[1]}')"
          if [[ "$XCODE_MAJOR" -lt 26 ]]; then
            echo "NFCove App Store candidates require Xcode 26 or newer."
            exit 1
          fi

      - name: Validate project contract
        run: |
          xcodebuild -project NFCove.xcodeproj -list
          plutil -lint NFCove/Resources/Info.plist
          plutil -lint NFCove/Resources/NFCove.entitlements
          plutil -lint NFCove/Resources/PrivacyInfo.xcprivacy
          python3 Tests/validate-release-contract.py

      - name: Run core logic tests
        run: zsh Tests/run-core-tests.sh

      - name: Build Release for iOS Simulator
        run: |
          xcodebuild \
            -project NFCove.xcodeproj \
            -scheme NFCove \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build-unsigned-ipa.sh
          scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NFCove-unsigned
          path: build/NFCove-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Build signed IPA when signing secrets are configured
        shell: bash
        run: |
          if [[ -z "$IOS_P12_BASE64" || -z "$IOS_PROFILE_BASE64" || -z "$IOS_P12_PASSWORD" ]]; then
            echo "Apple signing secrets are not configured. Unsigned IPA is still available."
            exit 0
          fi

          P12_PATH="$RUNNER_TEMP/nfcove-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/nfcove.mobileprovision"

          echo "$IOS_P12_BASE64" | base64 --decode > "$P12_PATH"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          export P12_PATH
          export PROVISIONING_PROFILE_PATH="$PROFILE_PATH"
          export P12_PASSWORD="$IOS_P12_PASSWORD"
          export KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-nfcove-ci-keychain}"
          export BUNDLE_ID="${IOS_BUNDLE_ID:-com.tiburonns.NFCove}"
          export EXPORT_METHOD="${IOS_EXPORT_METHOD:-app-store-connect}"
          export SIGNING_IDENTITY="${IOS_SIGNING_IDENTITY:-Apple Distribution}"

          chmod +x scripts/build-signed-ipa.sh
          scripts/build-signed-ipa.sh

      - name: Upload signed IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NFCove-signed
          path: build/NFCove.ipa
          if-no-files-found: ignore
          retention-days: 30
