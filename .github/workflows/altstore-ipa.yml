name: AltStore IPA Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          chmod +x scripts/build-unsigned-ipa.sh
          scripts/build-unsigned-ipa.sh
          test -f build/NFCove-unsigned.ipa
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${${ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(xcodebuild -project NFCove.xcodeproj -scheme NFCove -configuration Release -destination "generic/platform=iOS" -showBuildSettings | awk -F' = ' '/MARKETING_VERSION/{print $2; exit}')
          BUILD=$(xcodebuild -project NFCove.xcodeproj -scheme NFCove -configuration Release -destination "generic/platform=iOS" -showBuildSettings | awk -F' = ' '/CURRENT_PROJECT_VERSION/{print $2; exit}')
          TAG="altstore-$VERSION-$BUILD-${${ github.run_number }}"
          gh release create "$TAG" build/NFCove-unsigned.ipa --target "${${ github.sha }}" --title "NFCove $VERSION ($BUILD)" --generate-notes
